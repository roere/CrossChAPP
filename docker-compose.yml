services:
  web:
    build: .
    container_name: bni-dach-web
    command: ["sh", "/usr/local/bin/bni-dach-entrypoint"]
    ports:
      - "8082:80"
    volumes:
      - ./app:/var/www/html
      - ./data:/var/www/data
  worker:
    build: .
    container_name: bni-dach-worker
    command: ["sh", "/usr/local/bin/crosschapp-worker-entrypoint"]
    depends_on:
      - web
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
      - ./data:/var/www/data
