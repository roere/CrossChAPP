services:
  db:
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${CROSSCHAPP_DB_NAME:?CROSSCHAPP_DB_NAME must be set}
      MARIADB_USER: ${CROSSCHAPP_DB_USER:?CROSSCHAPP_DB_USER must be set}
      MARIADB_PASSWORD: ${CROSSCHAPP_DB_PASSWORD:?CROSSCHAPP_DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${CROSSCHAPP_DB_ROOT_PASSWORD:?CROSSCHAPP_DB_ROOT_PASSWORD must be set}
    volumes: !override
      - mariadb-data:/var/lib/mysql
    networks:
      - crosschapp-production
  web:
    build:
      context: .
    command: ["sh", "/usr/local/bin/bni-dach-entrypoint"]
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8082:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      CROSSCHAPP_DB_DRIVER: mysql
      CROSSCHAPP_DB_HOST: db
      CROSSCHAPP_DB_PORT: 3306
      CROSSCHAPP_DB_NAME: ${CROSSCHAPP_DB_NAME:?CROSSCHAPP_DB_NAME must be set}
      CROSSCHAPP_DB_USER: ${CROSSCHAPP_DB_USER:?CROSSCHAPP_DB_USER must be set}
      CROSSCHAPP_DB_PASSWORD: ${CROSSCHAPP_DB_PASSWORD:?CROSSCHAPP_DB_PASSWORD must be set}
      CROSSCHAPP_TRUSTED_PROXIES: ${CROSSCHAPP_TRUSTED_PROXIES:-172.30.0.1}
      CROSSCHAPP_WATCHLIST_INTERVAL_SECONDS: ${CROSSCHAPP_WATCHLIST_INTERVAL_SECONDS:-1800}
    volumes: !override
      - ./data:/var/www/data
    networks:
      - crosschapp-production
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1/api/health.php'),'\"ok\":true') ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
    profiles: ["worker"]
    restart: unless-stopped
    command: ["sh", "/usr/local/bin/crosschapp-worker-entrypoint"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      CROSSCHAPP_DB_DRIVER: mysql
      CROSSCHAPP_DB_HOST: db
      CROSSCHAPP_DB_PORT: 3306
      CROSSCHAPP_DB_NAME: ${CROSSCHAPP_DB_NAME:?CROSSCHAPP_DB_NAME must be set}
      CROSSCHAPP_DB_USER: ${CROSSCHAPP_DB_USER:?CROSSCHAPP_DB_USER must be set}
      CROSSCHAPP_DB_PASSWORD: ${CROSSCHAPP_DB_PASSWORD:?CROSSCHAPP_DB_PASSWORD must be set}
      CROSSCHAPP_WATCHLIST_INTERVAL_SECONDS: ${CROSSCHAPP_WATCHLIST_INTERVAL_SECONDS:-1800}
    volumes: !override
      - ./data:/var/www/data
    networks:
      - crosschapp-production

networks:
  crosschapp-production:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  mariadb-data:
